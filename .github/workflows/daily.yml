name: GhostDirector daily production
# Cloud replacement for the retired Windows Task Scheduler entry.

on:
  schedule:
    # 08:30 UTC = 10:30 Africa/Harare (UTC+2, no daylight saving).
    # MUST stay after Google's free-tier daily reset at midnight Pacific
    # (07:00 UTC PDT / 08:00 UTC PST) — the 06:00 UTC slot fired an hour
    # BEFORE the reset and ran the previous day's empty bucket (run #4,
    # 2026-09-30: every model 429'd, then the UTC-date quarantine kept
    # attempts 2–3 dead even after the 07:00 UTC refill).
    - cron: "30 8 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button for tests

permissions:
  contents: read

concurrency:
  group: daily-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      # FIX-071: xfade assembly holds every input's decoder + frame buffers
      # open; even bounded passes pushed the 7 GB runner into swap-less OOM
      # (run #5: pass 2 died silently, runner SIGTERM'd mid-render). A 4 GB
      # swapfile turns thrash into slow-but-steady rendering.
      - name: Add swap (OOM guard)
        run: |
          sudo fallocate -l 4G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore production state (DB, no-repeat ledger)
        uses: actions/cache@v4
        with:
          path: output/state
          key: gd-state-v1

      - name: Restore state files into live paths
        run: |
          mkdir -p db
          cp -f output/state/trending_news.json db/ 2>/dev/null || true
          cp -f output/state/ghostdirector.db output/ 2>/dev/null || true

      - name: Write secrets
        # FIX-072: secrets must reach the shell as ENV VARS, never as direct
        # ${{ }} interpolation inside double quotes — the JSON's own " chars
        # terminate the shell quoting and get stripped, writing
        # {installed: {...}} (invalid) — the exact JSONDecodeError that
        # killed the upload step in runs #1–#6. Env values bypass shell
        # parsing entirely; "$VAR" expansion preserves them.
        env:
          GD_ENV: ${{ secrets.GD_ENV }}
          GD_CLIENT_SECRETS: ${{ secrets.GD_CLIENT_SECRETS }}
          GD_YOUTUBE_TOKEN: ${{ secrets.GD_YOUTUBE_TOKEN }}
        run: |
          mkdir -p output/state
          printf '%s' "$GD_ENV" > .env
          printf '%s' "$GD_CLIENT_SECRETS" > client_secrets.json
          printf '%s' "$GD_YOUTUBE_TOKEN" > youtube_token.famefiles.json
          # Fail fast here (not 40 min in, at upload) if anything is mangled.
          python - <<'PY'
          import json, pathlib
          for name in ("client_secrets.json", "youtube_token.famefiles.json"):
              json.loads(pathlib.Path(name).read_text(encoding="utf-8"))
              print(f"{name}: valid JSON")
          env = pathlib.Path(".env").read_text(encoding="utf-8")
          keys = [l.split("=", 1)[0] for l in env.splitlines() if l.strip() and not l.startswith("#")]
          assert keys, ".env is empty"
          print(f".env: {len(keys)} keys")
          PY

      - name: Run daily production (short + long-form, UNLISTED)
        run: |
          # Gemini throws transient 503/429 "high demand" spikes; the whole
          # candidate chain can 503 at once. An unattended factory RETRIES
          # the full daily cycle instead of losing the day (the daily gate
          # makes each attempt idempotent / reclaimable).
          for attempt in 1 2 3; do
            echo "== Attempt $attempt at $(date -u +%H:%M) UTC =="
            python main.py --daily 2>&1 | tee output/_daily.log
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then exit 0; fi
            echo "Attempt $attempt failed (exit $code) - cooling down 10 min"
            sleep 600
          done
          exit 1

      - name: Snapshot state for the next run
        if: always()
        run: |
          # The no-repeat ledger (db/trending_news.json) + SQLite DB
          # (output/ghostdirector.db) decide story freshness and daily
          # idempotency; keep both across runs.
          mkdir -p output/state
          cp -f db/trending_news.json output/state/ 2>/dev/null || true
          cp -f output/ghostdirector.db output/state/ 2>/dev/null || true

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ github.run_id }}
          path: |
            output/_daily.log
            output/PUBLISH_QUEUE.md
            output/**/metadata.json
            output/**/final_qc_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Daily production — $(date -u +%F)"
            echo '```'
            grep -aE "Uploaded to|Upload skipped|Error|FAILED|COMPLETE|Quality gate" output/_daily.log | tail -20 || true
            echo '```'
            if [ -f output/PUBLISH_QUEUE.md ]; then
              echo "## 📢 Publish queue (unlisted = zero distribution — publish within 6h)"
              cat output/PUBLISH_QUEUE.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
