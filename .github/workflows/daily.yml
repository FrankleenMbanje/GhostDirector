name: GhostDirector daily production
# Cloud replacement for the retired Windows Task Scheduler entry.
#
# The day's slate runs as one job per video, chained in order so they share
# the no-repeat ledger and state (daily-job.yml hands state from job to job).
# Each video gets its own time budget and its own publish slot, so a job that
# runs long or is cancelled can only cost that one video — never the whole day.

on:
  schedule:
    # 08:30 UTC = 10:30 Africa/Harare (UTC+2, no daylight saving).
    # MUST stay after Google's free-tier daily reset at midnight Pacific
    # (07:00 UTC PDT / 08:00 UTC PST) — the 06:00 UTC slot fired an hour
    # BEFORE the reset and ran the previous day's empty bucket (run #4,
    # 2026-09-30: every model 429'd, then the UTC-date quarantine kept
    # attempts 2–3 dead even after the 07:00 UTC refill).
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 3 shorts + doc (daily gate) | shorts_only = 3 shorts, no doc | single_short = one ad-hoc short, no gate"
        type: choice
        options:
          - full
          - shorts_only
          - single_short
        default: full

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-production
  cancel-in-progress: false

jobs:
  stage-1:
    if: ${{ (inputs.mode || 'full') != 'single_short' }}
    uses: ./.github/workflows/daily-job.yml
    with:
      role: stage
      stage: 1
      previous_stage: 0
      mode: ${{ inputs.mode || 'full' }}
    secrets: inherit

  stage-2:
    needs: stage-1
    if: ${{ always() && (inputs.mode || 'full') != 'single_short' }}
    uses: ./.github/workflows/daily-job.yml
    with:
      role: stage
      stage: 2
      previous_stage: 1
      mode: ${{ inputs.mode || 'full' }}
    secrets: inherit

  stage-3:
    needs: stage-2
    if: ${{ always() && (inputs.mode || 'full') != 'single_short' }}
    uses: ./.github/workflows/daily-job.yml
    with:
      role: stage
      stage: 3
      previous_stage: 2
      mode: ${{ inputs.mode || 'full' }}
    secrets: inherit

  stage-4:
    needs: stage-3
    if: ${{ always() && (inputs.mode || 'full') != 'single_short' }}
    uses: ./.github/workflows/daily-job.yml
    with:
      role: stage
      stage: 4
      previous_stage: 3
      mode: ${{ inputs.mode || 'full' }}
    secrets: inherit

  finalize:
    needs: stage-4
    if: ${{ always() && (inputs.mode || 'full') != 'single_short' }}
    uses: ./.github/workflows/daily-job.yml
    with:
      role: finalize
      stage: 0
      previous_stage: 4
      mode: ${{ inputs.mode || 'full' }}
    secrets: inherit

  adhoc:
    if: ${{ inputs.mode == 'single_short' }}
    uses: ./.github/workflows/daily-job.yml
    with:
      role: adhoc
      stage: 0
      previous_stage: 0
      mode: single_short
    secrets: inherit
