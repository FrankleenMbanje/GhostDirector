name: Fame Files cloud checks
on:
  pull_request:
    paths:
      - 'local_studio/**'
      - 'tests/**'
      - 'requirements-local.txt'
      - '.github/workflows/fame-*.yml'
  push:
    branches: ['codex/free-cloud-unlisted']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-local.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Check actual cloud narration and caption timing
        env:
          PYTHONPATH: .
        run: python tests/smoke_voice.py
      - name: Check actual licensed archive downloading from GitHub
        env:
          PYTHONPATH: .
        run: python tests/smoke_media.py
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-local.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m compileall -q local_studio
      - run: npm ci --prefix local_studio/motion --no-audit --no-fund
      - run: npm run check --prefix local_studio/motion
      - name: Check browser motion rendering on Linux
        run: python -m local_studio.motion_cli still src/index.ts GraphicPlate ../../motion-check.png --frame=90 --gl=swangle --browser-executable=/usr/bin/google-chrome
      - name: Check bundled map worker and WebGL video export
        run: python -m local_studio.motion_cli render src/index.ts GraphicPlate ../../map-check.mp4 --props=../../tests/map-fixture.json --frames=0-29 --concurrency=2 --gl=swangle --browser-executable=/usr/bin/google-chrome
      - name: Check animated photo chapter-boundary duration
        env:
          PYTHONPATH: .
        run: python tests/smoke_layout.py
